<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>هدف تجربة الواقع المعزز</title>
  <style>
    body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;padding:28px}
    .wrap{max-width:760px;margin:auto;text-align:center}.badge{display:inline-block;padding:7px 14px;border:1px solid #d6a22a;border-radius:999px;color:#f3c85b;background:#d6a22a18}
    h1{font-size:40px;margin:22px 0 12px}.text{font-size:21px;line-height:2;color:#d7dee8}.card{margin-top:26px;background:#fff;border-radius:24px;padding:18px;color:#111;box-shadow:0 20px 60px #0008}.note{background:#fff6d9;padding:12px;border-radius:14px;color:#7a5200;margin-bottom:16px;font-weight:bold}.target{width:100%;max-width:620px;border-radius:14px;display:block;margin:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">تجربة الواقع المعزّز AR</span>
    <h1>الحضارة المصرية القديمة</h1>
    <p class="text">شيّد المصريون القدماء الأهرامات منذ آلاف السنين، فكانت شاهدًا على تقدّمهم المذهل في الهندسة والعمارة، وما زالت إلى اليوم رمزًا خالدًا لقوة الحضارة المصرية وعبقريتها.</p>
    <div class="card">
      <div class="note">اترك هذه الصورة ظاهرة كاملة على الشاشة، ثم وجّه إليها كاميرا الهاتف الثاني.</div>
      <img class="target" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.png" alt="AR target" />
    </div>
  </div>
</body>
</html>
