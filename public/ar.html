<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تجربة الواقع المعزز</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    .hint{position:fixed;z-index:20;top:14px;left:50%;transform:translateX(-50%);width:min(90vw,520px);background:rgba(15,23,42,.88);color:#fff;padding:12px 16px;border-radius:14px;text-align:center;line-height:1.6;border:1px solid rgba(251,191,36,.4)}
    .hint b{color:#fbbf24}
  </style>
</head>
<body>
  <div class="hint"><b>وجّه الكاميرا إلى الصورة الموجودة على الهاتف الأول.</b><br>عند التعرّف عليها سيظهر هرم ذهبي ثلاثي الأبعاد فوقها.</div>

  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-cone
        segments-radial="4"
        radius-bottom="0.42"
        radius-top="0"
        height="0.62"
        position="0 0.22 0.18"
        rotation="0 45 0"
        material="color: #d6a22a; metalness: 0.2; roughness: 0.55"
        animation="property: rotation; to: 0 405 0; dur: 7000; easing: linear; loop: true">
      </a-cone>
      <a-ring radius-inner="0.48" radius-outer="0.5" rotation="-90 0 0" position="0 -0.12 0.02" material="color: #fbbf24; opacity: 0.9"></a-ring>
    </a-entity>
  </a-scene>
</body>
</html>
